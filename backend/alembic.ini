# Configuración de Alembic (migraciones). La URL de la base de datos NO está aquí:
# migrations/env.py la lee de las variables de entorno (DATABASE_URL / MIGRATIONS_DATABASE_URL).
[alembic]
script_location = migrations
# Permite que env.py haga "from app.config import ..." al ejecutar alembic desde backend/
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
