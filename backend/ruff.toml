line-length = 120
target-version = "py312"

[lint]
# E/F: errores de pyflakes/pycodestyle · I: orden de imports · B: bugs comunes
# UP: sintaxis moderna · S: seguridad (bandit) · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "B008",  # Depends()/Query() en parámetros es el patrón oficial de FastAPI
    "S104",  # 0.0.0.0 es intencional dentro del contenedor
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # assert y contraseñas de prueba son esperables en tests
"app/seed.py" = ["S105", "S311"]  # contraseña demo pública a propósito; random no criptográfico es suficiente
"migrations/**" = ["S608"]
