[pytest]
# "pythonpath = ." permite hacer `from app.domain...` en los tests sin instalar nada.
pythonpath = .
testpaths = tests
markers =
    integration: pruebas contra PostgreSQL real (se omiten si no hay base de datos disponible)
filterwarnings =
    # Aviso de la propia librería de pruebas de Starlette, ajeno a este proyecto.
    ignore:Using .httpx. with .starlette.testclient.
